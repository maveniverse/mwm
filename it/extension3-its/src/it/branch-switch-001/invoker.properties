# 1st build on checked out branch-a
invoker.goals.1 = install -e
# 2nd build "on branch-b": simulated with Nisse provided properties (as Nisse extension would provide them)
invoker.goals.2 = install -e -Dnisse.jgit.remoteName=origin -Dnisse.jgit.remoteUrl=https://github.com/maveniverse/mwm.git -Dnisse.jgit.branchName=branch-b
