# simulate Nisse extension: it provides git properties of current checkout as user properties
invoker.goals = mwm:link -Dmwm.other=../link-001-other -Dnisse.jgit.remoteName=origin -Dnisse.jgit.remoteUrl=https://github.com/maveniverse/mwm.git -Dnisse.jgit.branchName=my-branch -e
