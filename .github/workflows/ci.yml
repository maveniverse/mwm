name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Verify
    uses: maveniverse/parent/.github/workflows/ci.yml@release-62
    with:
      # TODO: we want this below; once extensiob4 is done
      # maven-matrix: '[ "3.10.0-rc-1", "4.0.0-rc-6" ]'
      maven-matrix: '[ "3.10.0-rc-1" ]'
      maven-test: './mvnw clean verify -e -B -V -P run-its -f it'
